services:
  frigate:
    image: ghcr.io/blakeblackshear/frigate:0.15.1
    container_name: frigate
    restart: unless-stopped
    shm_size: "256mb"
    networks:
      - vms-net
    ports:
      - "5000:5000"   # Frigate HTTP API + HLS/WebRTC
      - "8554:8554"   # go2rtc RTSP re-streams
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 1m
      timeout: 20s
      retries: 3
      start_period: 40s
    volumes:
      - ./vms_shim/frigate/config:/config
      - ./vms_shim/frigate/videos:/videos:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
      - frigate_recordings:/media/frigate/recordings
    environment:
      no_proxy: "${no_proxy:-},frigate"
      NO_PROXY: "${NO_PROXY:-},frigate"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vms-adapter-backend
    expose:
      - "8080"
    ports:
      - "${BACKEND_PORT:-8085}:8080"
    volumes:
      - ./config:/app/config:ro
    env_file: .env
    environment:
      VMS_PLUGIN_CONFIG_PATH: /app/config/config.yaml
      VMS_PLUGIN_DATABASE_URL: "postgresql+asyncpg://${PG_USER:-vms}:${PG_PASSWORD:-vms}@postgres:${PG_PORT:-5434}/vms_plugin"
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      no_proxy: "${no_proxy:-},frigate,host.docker.internal,${NX_HOST:-},${LVC_HOST:-}"
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: "${NO_PROXY:-},frigate,host.docker.internal,${NX_HOST:-},${LVC_HOST:-}"
      MQTT_BROKER_HOST: "${MQTT_BROKER_HOST:-host.docker.internal}"
      MQTT_BROKER_PORT: "${MQTT_BROKER_PORT:-1883}"
    depends_on:
      postgres:
        condition: service_healthy
      frigate:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - vms-net

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: vms-adapter-ui
    ports:
      - "${UI_PORT:-3000}:80"
    environment:
      LVC_BASE_URL: "${LVC_BASE_URL:-http://host.docker.internal:4173}"
      MEDIAMTX_URL: "${MEDIAMTX_URL:-http://host.docker.internal:8889}"
    depends_on:
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "-Y", "off", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - vms-net

  postgres:
    image: postgres:15
    container_name: vms-adapter-postgres
    command: ["postgres", "-p", "${PG_PORT:-5434}"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: vms_plugin
      POSTGRES_USER: ${PG_USER:-vms}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-vms}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-vms} -d vms_plugin -p ${PG_PORT:-5434}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "${PG_HOST_PORT:-5433}:${PG_PORT:-5434}"
    networks:
      - vms-net

networks:
  vms-net:
    driver: bridge

volumes:
  pgdata:
  frigate_recordings:
